[project]
name = "open-hypergamy"
version = "0.1.0"
description = "Local-first CLI that discovers, verifies, scores and monitors research and education opportunities."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "r00tnomade" }]
keywords = ["opportunities", "research", "internships", "fellowships", "cli", "telegram", "web-monitoring"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "trafilatura>=1.12",
    "defusedxml>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "types-defusedxml",
]

[project.urls]
Homepage = "https://github.com/r00tnomade/open-hypergamy"
Issues = "https://github.com/r00tnomade/open-hypergamy/issues"

[project.scripts]
ohg = "open_hypergamy.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_hypergamy"]

# Installed (non-editable) copies need the SQL migrations; the GUI's built assets already live
# inside the package (src/open_hypergamy/gui/static, produced by `npm run build` in frontend/).
[tool.hatch.build.targets.wheel.force-include]
"migrations" = "open_hypergamy/_migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["feedparser.*", "trafilatura.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "UP031", "F811"]  # F811: fixtures imported from sibling test modules
"src/open_hypergamy/persistence/repositories/*.py" = ["E501"]  # long SQL literals
"src/open_hypergamy/discovery/review.py" = ["E501"]
"src/open_hypergamy/monitoring/*.py" = ["E501"]
"src/open_hypergamy/reporting/*.py" = ["E501"]  # dense report queries and templates
"src/open_hypergamy/scheduling/*.py" = ["E501"]
"src/open_hypergamy/cli_ops.py" = ["E501"]
"src/open_hypergamy/persistence/backups.py" = ["E501"]
"src/open_hypergamy/observability/health.py" = ["E501"]
"src/open_hypergamy/notifications/*.py" = ["E501"]
"src/open_hypergamy/scoring/*.py" = ["E501"]
"src/open_hypergamy/cli.py" = ["E501"]  # long Rich/f-string output literals
"src/open_hypergamy/llm/*.py" = ["E501"]
"src/open_hypergamy/extraction/llm_extractor.py" = ["E501"]
"src/open_hypergamy/discovery/promotion.py" = ["E501"]
