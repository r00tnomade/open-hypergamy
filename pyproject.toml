[project]
name = "opportunity-radar"
version = "0.1.0"
description = "Local CLI that discovers, verifies, scores and monitors research/education opportunities."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "trafilatura>=1.12",
    "defusedxml>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "types-defusedxml",
]

[project.scripts]
radar = "opportunity_radar.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opportunity_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["feedparser.*", "trafilatura.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "UP031", "F811"]  # F811: fixtures imported from sibling test modules
"src/opportunity_radar/persistence/repositories/*.py" = ["E501"]  # long SQL literals
"src/opportunity_radar/discovery/review.py" = ["E501"]
"src/opportunity_radar/monitoring/*.py" = ["E501"]
"src/opportunity_radar/reporting/*.py" = ["E501"]  # dense report queries and templates
"src/opportunity_radar/scheduling/*.py" = ["E501"]
"src/opportunity_radar/cli_ops.py" = ["E501"]
"src/opportunity_radar/persistence/backups.py" = ["E501"]
"src/opportunity_radar/observability/health.py" = ["E501"]
"src/opportunity_radar/notifications/*.py" = ["E501"]
"src/opportunity_radar/scoring/*.py" = ["E501"]
"src/opportunity_radar/cli.py" = ["E501"]  # long Rich/f-string output literals
"src/opportunity_radar/llm/*.py" = ["E501"]
"src/opportunity_radar/extraction/llm_extractor.py" = ["E501"]
"src/opportunity_radar/discovery/promotion.py" = ["E501"]
