# Copy to config/settings.yaml (git-ignored) to override defaults. Secrets never go here.
app:
  timezone: Europe/Berlin
  horizon_months: 24
  actionable_horizon_months: 12
  log_level: INFO
  # Crawler identity: sent as "OpenHypergamy/0.1 (+<info url>; <contact>)". Browser-like
  # user agents are rejected. Contact may also come from OHG_CRAWLER_CONTACT.
  user_agent: "OpenHypergamy/0.1"
  crawler_info_url: "https://github.com/r00tnomade/open-hypergamy"
  # crawler_contact: "mailto:you@example.org"
  max_response_bytes: 8000000
  request_timeout_seconds: 25
  max_redirects: 5
  max_retries: 2
  per_host_min_interval_seconds: 3.0   # floor; adaptive throttling only ever slows down
  per_host_max_concurrency: 1
  adaptive_throttle: true
  max_host_delay_seconds: 60
  host_cooldown_seconds: 300           # in-run pause for a host after 429/503
  max_concurrent_hosts: 4
  max_pages_per_source_run: 40
  max_crawl_depth: 2
  max_tracked_pages_per_source: 200   # child pages remembered and revalidated per source
  default_source_poll_interval_hours: 168

database:
  # path: defaults to <OHG_HOME>/open_hypergamy.sqlite3
  journal_mode: WAL
  busy_timeout_ms: 5000
  backup_keep_daily: 7
  backup_keep_weekly: 4

cache:
  enabled: true
  body_retention_days: 180
  llm_retention_days: 365

llm:
  enabled: true
  provider: freellmapi # freellmapi | local
  timeout_seconds: 90
  max_concurrency: 1
  temperature: 0.0
  max_output_tokens: 4000
  allow_remote_public_content: true
  extraction_cache: true
  freellmapi:
    base_url: "http://127.0.0.1:3001/v1"
    model: "auto:ohg-free"
    api_key_env: OHG_FREELLMAPI_API_KEY
    required_profile_name: ohg-free
    require_loopback: true
    free_tier_only: true # operator attestation; see `ohg init` checklist
    max_input_chars: 12000
  local:
    base_url: "http://127.0.0.1:3000/v1"
    model: "REPLACE_WITH_LOADED_LOCAL_MODEL_ID"
    manual_mode_only: true

browser:
  enable_playwright: false
  playwright_allowed_source_ids: []

telegram:
  enabled: true
  digest_enabled: true
  deadline_offsets_days: [30, 14, 7, 2]
  minimum_fit_score_for_immediate_alert: 75
  maximum_messages_per_run: 10
  retry_limit: 3

crawling:
  require_source_policy_review: true
  discover_outbound_sources_as_unverified: true
  allow_login_pages: false
  allow_captcha_bypass: false
  allow_paywall_bypass: false
  permitted_schemes: [https, http]
  cooldown_after_failures: 3   # transient failures in a row before a source cools down
  not_found_review_after: 2    # consecutive 404s before a source is held for review
  max_cooldown_hours: 168

scoring:
  weights:
    career_alignment: 30
    technical_research_value: 25
    eligibility_feasibility: 20
    funding_accessibility: 15
    time_cost: 10
